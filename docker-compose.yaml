name: "crunchit-backend"
services:
  api:
    build: ./go-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://app:app@pg:5432/crunchit?sslmode=disable"
      HTTP_ADDRESS: ":8080"
      STORAGE_DIR: "/downloads"
    command: ["./server","api"]
    depends_on:
        pg:
          condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - "./downloads:/downloads"
    networks:
      - crunchit-net
    restart: unless-stopped

  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crunchit
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - "pgdata:/var/lib/postgresql/DATABASE_URL"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "crunchit"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crunchit-net
  
  migrate:
    image: migrate/migrate
    profiles:
      - tools
    volumes:
      - "./migrations:/migrations:ro"
    depends_on:
        pg:
         condition: service_healthy
    command:
      [
        "-path",
        "./migrations",
        "-database",
        "postgres://app:app@pg:5432/crunchit?sslmode=disable",
        "up"
      ]
    networks:
      - crunchit-net
volumes:
  pgdata:
networks:
  crunchit-net: